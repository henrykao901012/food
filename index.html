<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#020617" />
  <title>動態增肌營養計算器</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.3/Sortable.min.js"></script>
  <style>
    .bar-fill { transition: width .4s cubic-bezier(.22,.61,.36,1), background-color .3s ease; }
    input[type=number]::-webkit-outer-spin-button,
    input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }
    body { -webkit-tap-highlight-color: transparent; color-scheme: dark; }
    .makeup-zone {
      background-image: repeating-linear-gradient(45deg,
        rgba(245,158,11,.45) 0, rgba(245,158,11,.45) 5px,
        rgba(245,158,11,.15) 5px, rgba(245,158,11,.15) 10px);
    }
    /* 拖曳相關 */
    .drag-handle { touch-action: none; cursor: grab; }
    .drag-handle:active { cursor: grabbing; }
    .sortable-ghost { opacity: .35; outline: 2px dashed #475569; border-radius: .75rem; }
    /* 分隔條回收區：拖分隔條靠近時亮起 */
    .bank-drop-active { border-color: rgb(251 191 36) !important; background-color: rgba(251,191,36,.07) !important; }
    .bank-drop-active span { color: rgb(251 191 36) !important; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased">

  <div class="max-w-md mx-auto min-h-screen bg-slate-900 shadow-2xl flex flex-col">

    <!-- ===== 頂部標題 ===== -->
    <header class="bg-slate-950 text-white px-5 pt-6 pb-5 sticky top-0 z-20 shadow-lg border-b border-slate-800">
      <div class="flex items-center justify-between mb-4">
        <div>
          <h1 class="text-xl font-bold tracking-tight">動態增肌營養計算器</h1>
          <p id="todayLabel" class="text-xs text-slate-500 mt-0.5">—</p>
        </div>
        <span class="text-2xl">💪</span>
      </div>

    </header>

    <main class="flex-1 px-4 py-4 space-y-4 pb-24">

      <!-- ===== 個人設定面板（可摺疊） ===== -->
      <section class="bg-slate-800 rounded-2xl shadow-sm overflow-hidden border border-slate-700">
        <button id="settingsToggle"
          class="w-full flex items-center justify-between px-5 py-4 active:bg-slate-700 transition">
          <span class="font-bold text-slate-200 flex items-center gap-2">
            <span>⚙️</span> 個人設定
          </span>
          <span id="settingsSummary" class="text-xs text-slate-500 font-medium flex items-center gap-1">
            <span id="summaryText">—</span>
            <span id="chevron" class="transition-transform inline-block">▾</span>
          </span>
        </button>

        <div id="settingsPanel" class="hidden px-5 border-t border-slate-700">
          <div class="space-y-4 pb-5 pt-4">
            <!-- 體重 -->
            <div>
              <label class="block text-xs font-semibold text-slate-400 mb-1.5">當前體重 (kg)</label>
              <input id="setWeight" type="number" inputmode="decimal" min="1" step="any"
                class="w-full bg-slate-700 border border-slate-600 rounded-xl px-4 py-3 text-base font-medium
                       text-slate-100 placeholder-slate-500
                       focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" />
            </div>
            <!-- 增肌策略 -->
            <div>
              <label class="block text-xs font-semibold text-slate-400 mb-1.5">增肌策略</label>
              <select id="setStrategy"
                class="w-full bg-slate-700 border border-slate-600 rounded-xl px-4 py-3 text-base font-medium
                       text-slate-100 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 appearance-none">
                <option value="maintain">維持期 (熱量不盈餘)</option>
                <option value="clean">乾淨增肌 (熱量盈餘 10%)</option>
                <option value="aggressive">激進增肌 (熱量盈餘 20%)</option>
              </select>
            </div>
            <!-- 試算預覽 -->
            <div id="goalPreview" class="bg-slate-700/60 rounded-xl p-3.5 text-xs text-slate-400 leading-relaxed border border-slate-600/50"></div>

            <button id="saveSettings"
              class="w-full bg-blue-600 hover:bg-blue-500 active:scale-[.98] text-white font-bold text-base
                     py-3.5 rounded-xl shadow-md transition-all">
              💾 儲存設定並重新計算
            </button>
          </div>
        </div>
      </section>

      <!-- ===== 進度條 Dashboard ===== -->
      <section class="bg-slate-800 rounded-2xl shadow-sm p-5 space-y-5 border border-slate-700">
        <!-- 蛋白質 -->
        <div>
          <div class="flex items-end justify-between mb-2">
            <div class="flex items-center gap-2 flex-wrap">
              <span class="w-2.5 h-2.5 rounded-full bg-blue-400"></span>
              <span class="font-semibold text-slate-200">蛋白質</span>
              <span id="proMakeup" class="hidden text-[11px] font-bold text-amber-300 bg-amber-900/40 border border-amber-600 px-1.5 py-0.5 rounded-md">
                ＋補吃 <span id="proMakeupVal">0</span>g
              </span>
            </div>
            <div class="text-right leading-none">
              <span id="proVal" class="text-2xl font-bold text-white">0</span>
              <span class="text-slate-500 text-sm">/ <span id="proGoal">0</span> g</span>
            </div>
          </div>
          <div class="relative h-4 w-full bg-slate-700 rounded-full overflow-hidden">
            <div id="proZone" class="makeup-zone absolute inset-y-0 hidden" style="left:100%;width:0%"></div>
            <div id="proBar" class="bar-fill absolute inset-y-0 left-0 rounded-full bg-blue-500" style="width:0%"></div>
            <div id="proDivider" class="absolute inset-y-0 w-0.5 bg-slate-400/60 hidden" style="left:100%"></div>
          </div>
          <p id="proRemain" class="text-xs mt-1.5 text-slate-400 font-medium">—</p>
        </div>

        <!-- 碳水 -->
        <div>
          <div class="flex items-end justify-between mb-2">
            <div class="flex items-center gap-2 flex-wrap">
              <span class="w-2.5 h-2.5 rounded-full bg-amber-400"></span>
              <span class="font-semibold text-slate-200">碳水（澱粉）</span>
              <span id="carbMakeup" class="hidden text-[11px] font-bold text-amber-300 bg-amber-900/40 border border-amber-600 px-1.5 py-0.5 rounded-md">
                ＋補吃 <span id="carbMakeupVal">0</span>g
              </span>
            </div>
            <div class="text-right leading-none">
              <span id="carbVal" class="text-2xl font-bold text-white">0</span>
              <span class="text-slate-500 text-sm">/ <span id="carbGoal">0</span> g</span>
            </div>
          </div>
          <div class="relative h-4 w-full bg-slate-700 rounded-full overflow-hidden">
            <div id="carbZone" class="makeup-zone absolute inset-y-0 hidden" style="left:100%;width:0%"></div>
            <div id="carbBar" class="bar-fill absolute inset-y-0 left-0 rounded-full bg-amber-500" style="width:0%"></div>
            <div id="carbDivider" class="absolute inset-y-0 w-0.5 bg-slate-400/60 hidden" style="left:100%"></div>
          </div>
          <p id="carbRemain" class="text-xs mt-1.5 text-slate-400 font-medium">—</p>
        </div>

        <!-- 補吃圖例 + 清除按鈕（有補吃時才顯示） -->
        <div id="makeupLegend" class="hidden items-center gap-2 text-[11px] text-slate-500 pt-2 border-t border-slate-700">
          <span class="makeup-zone inline-block w-6 h-3 rounded-sm border border-amber-700 shrink-0"></span>
          <span class="flex-1">斜紋區為「昨日缺口」補吃額度（不累積）</span>
          <button id="clearMakeup"
            class="shrink-0 text-[11px] font-semibold text-red-400 hover:text-red-300
                   px-2 py-1 rounded-lg hover:bg-red-900/30 active:scale-95 transition whitespace-nowrap">
            ✕ 清除補吃
          </button>
        </div>
      </section>

      <!-- ===== 飲食簽到輸入區 ===== -->
      <section class="bg-slate-800 rounded-2xl shadow-sm p-5 space-y-4 border border-slate-700">
        <h2 class="font-bold text-slate-200 flex items-center gap-2">
          <span>🍽️</span> 飲食簽到
        </h2>

        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1.5">食材品項</label>
          <select id="foodSelect"
            class="w-full bg-slate-700 border border-slate-600 rounded-xl px-4 py-3.5 text-base font-medium
                   text-slate-100 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 appearance-none">
          </select>
        </div>

        <div>
          <label id="amountLabel" class="block text-xs font-semibold text-slate-400 mb-1.5">實際秤重 (g)</label>
          <input id="amountInput" type="number" inputmode="decimal" step="any" placeholder="0"
            class="w-full bg-slate-700 border border-slate-600 rounded-xl px-4 py-3.5 text-base font-medium
                   text-slate-100 placeholder-slate-500
                   focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" />
          <p id="preview" class="text-xs text-slate-500 mt-1.5 h-4"></p>
        </div>

        <button id="addBtn"
          class="w-full bg-blue-600 hover:bg-blue-500 active:scale-[.98] text-white font-bold text-base
                 py-4 rounded-xl shadow-md shadow-blue-600/20 transition-all">
          ＋ 送出紀錄
        </button>
      </section>

      <!-- ===== 今日飲食明細 ===== -->
      <section class="bg-slate-800 rounded-2xl shadow-sm p-5 border border-slate-700">
        <div class="flex items-center justify-between mb-3">
          <h2 class="font-bold text-slate-200 flex items-center gap-2">
            <span>📋</span> 今日明細
          </h2>
          <button id="clearBtn"
            class="text-xs font-semibold text-red-400 hover:text-red-300 active:scale-95 transition
                   px-3 py-1.5 rounded-lg hover:bg-red-900/30">
            🗑️ 清空重來
          </button>
        </div>

        <!-- 分隔條來源（clone 模式，拖入清單；清單的分隔條拖回此處即刪除） -->
        <div class="flex items-center gap-3 mb-3 pb-3 border-b border-slate-700/60">
          <div id="dividerBank">
            <div data-log-id="__bank__" data-log-type="divider"
                 class="flex items-center gap-2 border border-dashed border-slate-500 rounded-lg
                        px-3 py-2 cursor-grab select-none transition-all duration-150
                        text-slate-400 text-xs hover:border-slate-400 hover:text-slate-300 w-fit">
              <span class="text-sm leading-none">⠿</span>
              <span>── 分隔條 ──</span>
            </div>
          </div>
          <p class="text-[11px] text-slate-600 leading-snug">拖入清單分組<br>拖回此處刪除</p>
        </div>

        <ul id="logList" class="space-y-2 min-h-[2rem]"></ul>
        <p id="emptyHint" class="text-center text-sm text-slate-500 py-8">今天還沒有紀錄，開吃吧！🍗</p>
      </section>

    </main>
  </div>

  <script>
  /* =========================================================
     【1. 靜態食材庫 FOOD_DB】— 未來要改食材直接改這裡
     unit:'g'  → 秤重，營養為「每 100g」含量
     unit:'pc' → 計件，營養為「每 1 件（顆/根）」含量
     ========================================================= */
  const FOOD_DB = [
    { id: 'chicken',   name: 'Costco益活雞胸肉',              cat: 'protein', unit: 'g',     protein: 23.0, carb: 0.0   },
    { id: 'tenderloin', name: '雞里肌',                       cat: 'protein', unit: 'g',     protein: 23.0, carb: 0.0   },
    { id: 'tofu',      name: '板豆腐',                        cat: 'protein', unit: 'g',     protein: 8.5,  carb: 2.0,  defaultAmount: 100 },
    { id: 'beef',      name: '牛小排',                        cat: 'protein', unit: 'g',     protein: 18.0, carb: 0.0   },
    { id: 'beef2',     name: '牛肉板鍵',                      cat: 'protein', unit: 'g',     protein: 20.0, carb: 0.0   },
    { id: 'beef3',     name: '嫩肩肋眼牛排',                   cat: 'protein', unit: 'g',     protein: 21.0, carb: 0.0   },
    { id: 'shrimp',    name: '純生蝦仁',                      cat: 'protein', unit: 'g',     protein: 21.0, carb: 0.0   },
    { id: 'egg',       name: '雞蛋',                          cat: 'protein', unit: 'pc',    protein: 6.5,  carb: 0.6,  pieceName: '顆', defaultAmount: 2 },
    { id: 'whey',      name: 'ON金牌乳清蛋白 (摩卡卡布奇諾)', cat: 'protein', unit: 'scoop', protein: 24.0, carb: 3.0,  pieceName: '湯匙', defaultAmount: 1 },
    { id: 'cheese',    name: '起司絲',                        cat: 'protein', unit: 'g',     protein: 23.5, carb: 5.0,  defaultAmount: 20 },
    { id: 't65',       name: 'T65歐包 (麵粉重)',              cat: 'carb',    unit: 'g',     protein: 10.5, carb: 61.4, defaultAmount: 300 },
    { id: 'pasta',     name: '義大利麵 (乾重)',                cat: 'carb',    unit: 'g',     protein: 12.5, carb: 75.0  },
    { id: 'pasta2',    name: 'Garofalo義大利麵 (乾重)',        cat: 'carb',    unit: 'g',     protein: 14.0, carb: 73.0  },
    { id: 'rice',      name: '白飯（生米）',                   cat: 'carb',    unit: 'g',     protein: 7.4,  carb: 77.4, defaultAmount: 100 },
    { id: 'banana',    name: '香蕉',                          cat: 'carb',    unit: 'pc',    protein: 1.0,  carb: 25.0, pieceName: '根', defaultAmount: 1 },
    { id: 'tahini',    name: '芝麻醬',                        cat: 'other',   unit: 'g',     protein: 20.0, carb: 16.0  },
    { id: 'avocado',   name: '酪梨',                          cat: 'other',   unit: 'g',     protein: 2.0,  carb: 9.0,  defaultAmount: 100 },
    { id: 'mcdonalds', name: '麥當勞牛肉堡薯條可樂冰炫風',    cat: 'other',   unit: 'pc',    protein: 42.5, carb: 182.0, pieceName: '份', defaultAmount: 1 },
  ];

  /* 【增肌策略】熱量盈餘 → 直接反映在碳水倍率 */
  const STRATEGY = {
    maintain:   { label: '維持期',   mult: 1.00 },
    clean:      { label: '乾淨增肌', mult: 1.10 },
    aggressive: { label: '激進增肌', mult: 1.20 },
  };

  const DEFAULT_SETTINGS = { weight: 68, strategy: 'clean' };
  const LS_KEY = 'muscleNutritionApp.v2';

  /* =========================================================
     【2. 工具函式】
     ========================================================= */
  const r1     = n => Math.round(n * 10) / 10;
  const round5 = n => Math.round(n / 5) * 5;
  const dateStrOf = d => {
    const p = x => String(x).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
  };
  // 凌晨 5 點前仍視為前一天（日記錄在 05:00 才跨日重置）
  const appDayStr = () => { const d = new Date(); if (d.getHours() < 5) d.setDate(d.getDate() - 1); return dateStrOf(d); };
  const appYesterdayStr = () => { const d = new Date(); if (d.getHours() < 5) d.setDate(d.getDate() - 1); d.setDate(d.getDate() - 1); return dateStrOf(d); };
  const nowTime = () => {
    const d = new Date(), p = x => String(x).padStart(2, '0');
    return `${p(d.getHours())}:${p(d.getMinutes())}`;
  };
  const foodById = id => FOOD_DB.find(f => f.id === id);

  function calcNutrition(food, amount) {
    const factor = food.unit === 'g' ? amount / 100 : amount;
    return { protein: food.protein * factor, carb: food.carb * factor };
  }

  /* =========================================================
     【3. 核心：依生理資訊動態計算每日目標】
       蛋白質 = 體重 × 2.2
       碳水   = 體重 × 5.5 × 策略倍率（無訓練/休息日之分）
     ========================================================= */
  function computeGoals(s) {
    const w = Number(s.weight) || 0;
    const protein = Math.round(w * 2.2);
    const carb = round5(w * 5.5 * (STRATEGY[s.strategy]?.mult || 1));
    return { protein, carb };
  }

  /* =========================================================
     【4. 狀態 (localStorage)】
       state = { date, mode, settings:{weight,strategy,freq}, logs:[...] }
     ========================================================= */
  let state = loadState();

  function defaultState() {
    return { date: appDayStr(), settings: { ...DEFAULT_SETTINGS }, logs: [] };
  }
  function buildCarryover(s) {
    if (!s.logs || s.logs.length === 0) return null;
    const goal = computeGoals(s.settings);
    const tot = s.logs.reduce((a, l) => { a.p += l.protein; a.c += l.carb; return a; }, { p: 0, c: 0 });
    const proGap = Math.max(0, r1(goal.protein - tot.p));
    const carbGap = Math.max(0, r1(goal.carb - tot.c));
    if (proGap <= 0 && carbGap <= 0) return null;
    return { date: s.date, proGap, carbGap };
  }
  function loadState() {
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (!raw) return defaultState();
      const s = JSON.parse(raw);
      s.settings = { ...DEFAULT_SETTINGS, ...(s.settings || {}) };
      if (s.date !== appDayStr()) {
        s.carryover = buildCarryover(s);
        s.date = appDayStr();
        s.logs = [];
      }
      return s;
    } catch (e) {
      return defaultState();
    }
  }
  function saveState() { localStorage.setItem(LS_KEY, JSON.stringify(state)); }

  /* =========================================================
     【5. DOM 參照 + 下拉選單初始化】
     ========================================================= */
  const el = id => document.getElementById(id);
  const foodSelect = el('foodSelect');
  const amountInput = el('amountInput');
  const amountLabel = el('amountLabel');
  const preview = el('preview');

  const CAT_LABEL = { protein: '🥩 蛋白質', carb: '🍚 碳水', other: '🥑 其他' };
  ['protein', 'carb', 'other'].forEach(cat => {
    const grp = document.createElement('optgroup');
    grp.label = CAT_LABEL[cat];
    FOOD_DB.filter(f => f.cat === cat).forEach(f => {
      const opt = document.createElement('option');
      opt.value = f.id; opt.textContent = f.name;
      grp.appendChild(opt);
    });
    foodSelect.appendChild(grp);
  });

  /* =========================================================
     【6. 渲染：Dashboard】
     ========================================================= */
  function getTotals() {
    return state.logs.reduce((a, l) => {
      if (l.type === 'divider') return a;          // 分隔條不計入營養
      a.protein += l.protein; a.carb += l.carb;
      return a;
    }, { protein: 0, carb: 0 });
  }
  function renderDashboard() {
    const goal = computeGoals(state.settings);
    const t = getTotals();
    const co = (state.carryover && state.carryover.date === appYesterdayStr()) ? state.carryover : {};
    const proMakeup = Math.max(0, co.proGap || 0);
    const carbMakeup = Math.max(0, co.carbGap || 0);
    el('todayLabel').textContent = state.date;
    renderBar('pro', t.protein, goal.protein, proMakeup, 'blue');
    renderBar('carb', t.carb, goal.carb, carbMakeup, 'amber');
    const legend = el('makeupLegend');
    const hasMakeup = proMakeup > 0 || carbMakeup > 0;
    legend.classList.toggle('hidden', !hasMakeup);
    legend.classList.toggle('flex', hasMakeup);
  }
  function renderBar(prefix, value, goal, makeup, color) {
    const total = goal + makeup;
    const fillPct = total > 0 ? Math.min((value / total) * 100, 100) : 0;
    const goalPct = total > 0 ? (goal / total) * 100 : 100;
    const reachedToday = goal > 0 && value >= goal;
    const reachedAll = total > 0 && value >= total;

    el(prefix + 'Val').textContent = r1(value);
    el(prefix + 'Goal').textContent = goal;

    const badge = el(prefix + 'Makeup');
    if (makeup > 0) { badge.classList.remove('hidden'); el(prefix + 'MakeupVal').textContent = r1(makeup); }
    else badge.classList.add('hidden');

    const zone = el(prefix + 'Zone');
    const divider = el(prefix + 'Divider');
    if (makeup > 0) {
      zone.style.left = goalPct + '%';
      zone.style.width = (100 - goalPct) + '%';
      zone.classList.remove('hidden');
      divider.style.left = goalPct + '%';
      divider.classList.remove('hidden');
    } else {
      zone.classList.add('hidden');
      divider.classList.add('hidden');
    }

    const bar = el(prefix + 'Bar');
    bar.style.width = fillPct + '%';
    const baseColor = color === 'blue' ? 'bg-blue-500' : 'bg-amber-500';
    bar.className = 'bar-fill absolute inset-y-0 left-0 rounded-full ' + (reachedAll ? 'bg-green-500' : baseColor);

    const remainEl = el(prefix + 'Remain');
    if (makeup <= 0) {
      if (reachedToday) {
        const over = r1(value - goal);
        remainEl.textContent = over > 0 ? `✅ 已達標（超出 ${over} g）` : '✅ 已達標';
        remainEl.className = 'text-xs mt-1.5 text-green-400 font-bold';
      } else {
        remainEl.textContent = `還差 ${r1(goal - value)} g`;
        remainEl.className = 'text-xs mt-1.5 text-slate-400 font-medium';
      }
    } else {
      if (reachedAll) {
        remainEl.textContent = '✅ 今日目標 + 補吃全部達成！';
        remainEl.className = 'text-xs mt-1.5 text-green-400 font-bold';
      } else if (reachedToday) {
        remainEl.innerHTML = `✅ 今日達標！<span class="text-amber-400">補吃還差 ${r1(total - value)} g</span>`;
        remainEl.className = 'text-xs mt-1.5 font-semibold';
      } else {
        remainEl.innerHTML = `今日還差 ${r1(goal - value)} g <span class="text-amber-400">（含補吃共 ${r1(total - value)} g）</span>`;
        remainEl.className = 'text-xs mt-1.5 text-slate-400 font-medium';
      }
    }
  }

  /* =========================================================
     【7. 渲染：今日明細（含分隔條與拖曳把手）】
     ========================================================= */
  let _sortableList = null;
  let _sortableBank = null;

  function renderLogs() {
    const list = el('logList');
    list.innerHTML = '';
    const hint = el('emptyHint');
    hint.style.display = state.logs.length === 0 ? 'block' : 'none';

    // 按照 state.logs 順序渲染（不反轉，拖曳排序靠 Sortable 維護）
    state.logs.forEach(log => {
      const li = document.createElement('li');

      if (log.type === 'divider') {
        // ── 分隔條 ──
        li.dataset.logId = log.id;
        li.dataset.logType = 'divider';
        li.className = 'flex items-center gap-2 py-1.5 select-none';
        li.innerHTML = `
          <span class="drag-handle text-slate-600 hover:text-slate-400 px-1 text-base leading-none">⠿</span>
          <div class="flex-1 border-t-2 border-dashed border-slate-600/70 rounded"></div>`;
      } else {
        // ── 食材紀錄 ──
        const food = foodById(log.foodId);
        const unitTxt = log.unit === 'g'
          ? `${r1(log.amount)} g`
          : `${r1(log.amount)} ${food?.pieceName || '件'}`;
        li.dataset.logId = log.id;
        li.dataset.logType = 'food';
        li.className = 'flex items-center gap-2 bg-slate-700/60 rounded-xl pl-1.5 pr-3.5 py-3 border border-slate-700';
        li.innerHTML = `
          <span class="drag-handle text-slate-600 hover:text-slate-400 px-1 text-base leading-none shrink-0">⠿</span>
          <div class="min-w-0 flex-1">
            <div class="flex items-center gap-2">
              <span class="font-semibold text-slate-100 truncate">${log.name}</span>
              <span class="text-[11px] text-slate-500 shrink-0">${log.time}</span>
            </div>
            <div class="text-xs text-slate-400 mt-0.5">
              ${unitTxt}
              ・ <span class="text-blue-400 font-medium">蛋 ${r1(log.protein)}g</span>
              ・ <span class="text-amber-400 font-medium">碳 ${r1(log.carb)}g</span>
            </div>
          </div>
          <button data-del="${log.id}"
            class="shrink-0 w-9 h-9 flex items-center justify-center rounded-lg text-slate-500
                   hover:text-red-400 hover:bg-red-900/30 active:scale-90 transition text-lg">✕</button>`;
      }
      list.appendChild(li);
    });

    list.querySelectorAll('[data-del]').forEach(btn =>
      btn.addEventListener('click', () => deleteLog(btn.dataset.del)));

    initSortable();
  }

  function initSortable() {
    // 銷毀舊實例（DOM 重建後必須重新初始化）
    if (_sortableList) { try { _sortableList.destroy(); } catch(e){} _sortableList = null; }
    if (_sortableBank) { try { _sortableBank.destroy(); } catch(e){} _sortableBank = null; }

    const listEl  = el('logList');
    const bankEl  = el('dividerBank');
    if (!listEl || !bankEl || typeof Sortable === 'undefined') return;

    // ── 清單 Sortable ──
    _sortableList = Sortable.create(listEl, {
      group:      { name: 'list', pull: true, put: ['bank'] },
      handle:     '.drag-handle',
      animation:  160,
      delay:      80,           // 手機上避免誤觸：稍微長按才啟動
      delayOnTouchOnly: true,

      onStart() {
        bankEl.firstElementChild.classList.add('bank-drop-active');
      },

      onMove(evt) {
        // 分隔條可以去任何地方
        if (evt.dragged.dataset.logType === 'divider') return true;
        // 食材不能穿越分隔條（related 是分隔條時擋住）
        if (evt.related?.dataset.logType === 'divider') return false;
        return true;
      },

      onEnd(evt) {
        bankEl.firstElementChild.classList.remove('bank-drop-active');
        if (evt.from !== evt.to) return; // 跨清單由 bank onAdd 處理
        // 讀取新 DOM 順序 → 更新 state
        const newLogs = [...listEl.querySelectorAll('[data-log-id]')].map(el => {
          const id = el.dataset.logId;
          return state.logs.find(l => l.id === id)
              || { type: 'divider', id };
        }).filter(Boolean);
        state.logs = newLogs;
        saveState();
        setTimeout(() => renderLogs(), 0);
      },

      onAdd(evt) {
        // 從 bank 拖進來的新分隔條
        const idx = evt.newIndex;
        evt.item.remove();                           // 移除 Sortable 插入的 clone DOM
        state.logs.splice(idx, 0, { type: 'divider', id: `div_${Date.now()}` });
        saveState();
        setTimeout(() => renderLogs(), 0);
      },
    });

    // ── 分隔條來源 Sortable（clone 模式） ──
    _sortableBank = Sortable.create(bankEl, {
      group:     { name: 'bank', pull: 'clone', put: ['list'] },
      sort:      false,
      animation: 100,

      onMove(evt) {
        // 只有分隔條可以拖回 bank（食材不行）
        return evt.dragged.dataset.logType === 'divider';
      },

      onAdd(evt) {
        // 清單裡的分隔條被拖回 bank → 刪除
        const divId = evt.item.dataset.logId;
        evt.item.remove();
        if (divId && divId !== '__bank__') {
          state.logs = state.logs.filter(l => l.id !== divId);
          saveState();
          setTimeout(() => renderLogs(), 0);
        }
      },
    });
  }

  /* =========================================================
     【8. 渲染：設定摘要】
     ========================================================= */
  function renderSummary() {
    const s = state.settings;
    el('summaryText').textContent = `${s.weight}kg ・ ${STRATEGY[s.strategy].label}`;
  }

  /* =========================================================
     【9. 設定面板：填入欄位 / 試算預覽 / 展開收合】
     ========================================================= */
  function fillSettingsForm() {
    el('setWeight').value = state.settings.weight;
    el('setStrategy').value = state.settings.strategy;
    renderGoalPreview();
  }
  function readForm() {
    return {
      weight: parseFloat(el('setWeight').value) || 0,
      strategy: el('setStrategy').value,
    };
  }
  function renderGoalPreview() {
    const g = computeGoals(readForm());
    el('goalPreview').innerHTML =
      `📊 試算結果（按下儲存後套用）<br>
       蛋白質：<b class="text-blue-400">${g.protein} g</b><br>
       碳水：<b class="text-amber-400">${g.carb} g</b>`;
  }

  let panelOpen = false;
  function setPanel(open) {
    panelOpen = open;
    el('settingsPanel').classList.toggle('hidden', !open);
    el('chevron').style.transform = open ? 'rotate(180deg)' : 'rotate(0deg)';
  }

  /* =========================================================
     【10. 即時換算預覽 + 輸入框 Label 切換】
     ========================================================= */
  function updateAmountLabel() {
    const food = foodById(foodSelect.value);
    if (!food) return;
    const buildPlaceholder = (hint) => {
      if (food.defaultAmount != null) return `${food.defaultAmount}${hint}`;
      return `例如 ${hint}`;
    };
    if (food.unit === 'pc') {
      amountLabel.textContent = '輸入數量 (顆 / 根)';
      amountInput.setAttribute('inputmode', 'numeric');
      amountInput.placeholder = buildPlaceholder(food.pieceName);
    } else if (food.unit === 'scoop') {
      amountLabel.textContent = '輸入份量 (湯匙 / scoop)';
      amountInput.setAttribute('inputmode', 'decimal');
      amountInput.placeholder = buildPlaceholder('湯匙');
    } else {
      amountLabel.textContent = '實際秤重重量 (g)';
      amountInput.setAttribute('inputmode', 'decimal');
      amountInput.placeholder = buildPlaceholder('g');
    }
    updatePreview();
  }
  function updatePreview() {
    const food = foodById(foodSelect.value);
    const raw = parseFloat(amountInput.value);
    const amount = Math.abs(raw);
    if (!food || !amount || isNaN(amount)) { preview.textContent = ''; return; }
    const n = calcNutrition(food, amount);
    const hint = raw < 0 ? '（倒扣 ' + r1(amount) + '）' : '';
    preview.textContent = `↳${hint} 蛋白質 +${r1(n.protein)}g ・ 碳水 +${r1(n.carb)}g`;
  }

  /* =========================================================
     【11. 動作】
     ========================================================= */
  function addLog() {
    const food = foodById(foodSelect.value);
    if (!food) return;
    const raw = parseFloat(amountInput.value);
    const amount = (!amountInput.value.trim() && food.defaultAmount != null)
      ? food.defaultAmount
      : Math.abs(raw);
    if (!amount || isNaN(amount)) {
      amountInput.focus();
      amountInput.classList.add('ring-2', 'ring-red-500');
      setTimeout(() => amountInput.classList.remove('ring-2', 'ring-red-500'), 800);
      return;
    }
    const n = calcNutrition(food, amount);
    state.logs.unshift({
      id: `${Date.now()}_${Math.floor(Math.random() * 1000)}`,
      type: 'food',
      foodId: food.id, name: food.name, amount, unit: food.unit,
      protein: n.protein, carb: n.carb, time: nowTime(),
    });
    saveState();
    amountInput.value = ''; preview.textContent = '';
    renderAll();
  }
  function deleteLog(id) {
    state.logs = state.logs.filter(l => l.id !== id);
    saveState(); renderAll();
  }
  function clearToday() {
    if (state.logs.length === 0) return;
    if (!confirm('確定要清空今日所有紀錄嗎？此動作無法復原。')) return;
    state.logs = []; saveState(); renderAll();
  }
  function saveSettings() {
    const f = readForm();
    if (!f.weight || f.weight <= 0) {
      el('setWeight').focus();
      el('setWeight').classList.add('ring-2', 'ring-red-500');
      setTimeout(() => el('setWeight').classList.remove('ring-2', 'ring-red-500'), 800);
      return;
    }
    state.settings = f;
    saveState();
    renderAll();
    setPanel(false);
    const btn = el('saveSettings');
    const old = btn.textContent;
    btn.textContent = '✅ 已更新目標！';
    setTimeout(() => { btn.textContent = old; }, 1400);
  }

  /* =========================================================
     【12. 統一渲染 + 事件】
     ========================================================= */
  function renderAll() {
    renderSummary();
    renderDashboard();
    renderLogs();
  }

  el('addBtn').addEventListener('click', addLog);
  el('clearBtn').addEventListener('click', clearToday);
  el('saveSettings').addEventListener('click', saveSettings);
  el('settingsToggle').addEventListener('click', () => setPanel(!panelOpen));
  el('clearMakeup').addEventListener('click', () => {
    if (!confirm('確定清除補吃額度？昨日缺口將不再顯示。')) return;
    state.carryover = null;
    saveState();
    renderAll();
  });
  foodSelect.addEventListener('change', updateAmountLabel);
  amountInput.addEventListener('input', updatePreview);
  amountInput.addEventListener('keydown', e => { if (e.key === 'Enter') addLog(); });
  ['setWeight', 'setStrategy'].forEach(id => {
    el(id).addEventListener('input', renderGoalPreview);
    el(id).addEventListener('change', renderGoalPreview);
  });

  /* =========================================================
     【13. 啟動】
     ========================================================= */
  fillSettingsForm();
  updateAmountLabel();
  renderAll();
  </script>
</body>
</html>
